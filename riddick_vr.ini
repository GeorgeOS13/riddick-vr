; Riddick VR configuration (Track C #10).
; Place next to opengl32.dll / DarkAthena.exe or in the working directory.
; Missing file or keys fall back to compiled defaults.
[VR]
; Snap turn step in degrees (15-90)
SnapAngleDeg=45
; Smooth turn curve gain (1-60)
SmoothTurnSpeed=20
; Left-stick radial deadzone (0.05-0.60)
MoveDeadzone=0.22
; Right-stick smooth-turn deadzone (0.05-0.60)
TurnDeadzone=0.20
; Dialogue/menu analog direction threshold (0.15-0.80)
DialogueDeadzone=0.50
; GH #45: Head-look mouse sensitivity (50-2000). Tune these until
; head movement feels 1:1 with zero lag. Higher = faster in-game turn
; per degree of real head rotation.
LookSensitivityYaw=445.6
LookSensitivityPitch=445.6
; Comfort vignette proxy during move/turn (0/1) + gain (0-2) + max dim (0-1)
ComfortEnabled=1
ComfortStrength=1.0
ComfortMaxDim=0.45
; Seated mode: compensate eye height, disable physical auto-crouch (0/1)
Seated=0
SeatedEyeOffset=0.15
; Fixed standing eye-height baseline in meters (0 = auto-calibrate)
StandingEyeHeight=0
; World scale multiplier applied to interaction volumes + hand render (0.5-2.0)
WorldScale=1.0
; Southpaw: swap dominant/off-hand for aim/ADS/reload-waist/holster (0/1)
Southpaw=0
; Per-action gesture debounce in ms (clamped 120-250)
GestureDebounceMs=180
; GH #40: Diegetic ammo quad crop rect (fraction of swapchain, 0.0-1.0).
; Adjust if ammo digits are misaligned for your resolution/weapon.
AmmoQuadCropX=0.75
AmmoQuadCropY=0.75
AmmoQuadCropW=0.23
AmmoQuadCropH=0.23
; GH #40: Wrist HUD crop rect (fraction of swapchain, 0.0-1.0).
WristHudCropW=0.26
WristHudCropH=0.16
